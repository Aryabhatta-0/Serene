[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serene"
version = "0.1.0"
description = "Serene - a self-correcting, evidence-bound family intelligence agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Serene" }]
# The Domain Kernel depends on Pydantic only. Everything else is an optional
# adapter dependency so the kernel stays runtime-replaceable.
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# Postgres/Supabase EventStore + projection store adapter.
postgres = ["psycopg[binary]>=3.2,<4"]
# neatlogs runtime observability adapter (optional; telemetry never gates correctness).
observability = ["neatlogs>=1.4.26,<2"]
# Inspect AI evaluation harness.
eval = ["inspect-ai>=0.3.278,<0.4"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.168,<7",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    # Bundled PostgreSQL binaries for local integration tests without Docker.
    "pgserver>=0.1.4,<0.2",
]

[tool.setuptools.packages.find]
include = ["serene*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a real PostgreSQL (SERENE_TEST_DATABASE_URL or local pgserver)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app", "memory_repo", "supabase"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert is the pytest idiom
    "RUF012", # pydantic ClassVar false positives
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"eval/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["serene"]

[[tool.mypy.overrides]]
module = ["neatlogs.*", "pgserver.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
