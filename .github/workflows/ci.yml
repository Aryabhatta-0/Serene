name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel (lint, types, tests, ledger + secret checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database; not a secret. Tests create and drop their own databases.
      SERENE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (incl. Postgres ledger + Hypothesis invariants)
        run: uv run pytest
      - name: Ledger replay / hash-chain self-check
        run: uv run python scripts/ledger_selfcheck.py
      - name: Secret / PII scan
        run: uv run python scripts/secret_scan.py

  eval-smoke:
    name: Inspect AI eval gate (no model keys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSPECT_LOGS: eval/reports/local/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - name: Run deterministic kernel-invariant scenarios through Inspect AI
        run: >-
          uv run inspect eval eval/tasks/kernel_invariants.py --model mockllm/model
          --log-dir "$INSPECT_LOGS" --display plain
      - name: Run deterministic trust scenarios (promotion, approval, Dream, scorers, cost)
        run: >-
          uv run inspect eval eval/tasks/trust_invariants.py --model mockllm/model
          --log-dir "$INSPECT_LOGS" --display plain
      - name: Run frozen runtime investigation scenarios (scripted Hermes wire)
        run: >-
          uv run inspect eval eval/tasks/runtime_investigation.py --model mockllm/model
          --log-dir "$INSPECT_LOGS" --display plain
      # `inspect eval` exits 0 even when a sample is INCORRECT; this step is the gate.
      - name: Gate - every sample of every task must be CORRECT
        run: >-
          uv run python scripts/inspect_gate.py "$INSPECT_LOGS"
          kernel_invariants trust_invariants runtime_investigation

  web:
    name: Web (next.js typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
